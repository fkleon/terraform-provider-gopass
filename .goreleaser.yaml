# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    main: ./main.go

upx:
  - enabled: true
    goos: [linux, windows]
    compress: best
    lzma: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE.md
        info:
          mtime: "{{ .CommitDate }}"

report_sizes: true
